server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the raw captures with the right type so browsers offer to save
    # them (and Wireshark opens them) instead of rendering binary junk.
    location /pcaps/ {
        types { application/vnd.tcpdump.pcap pcap; }
        default_type application/vnd.tcpdump.pcap;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control 'no-cache' always;
    }

    location = /network.json {
        default_type application/json;
        add_header Cache-Control 'no-store' always;
    }

    # Lets the welcome page show the address the visitor is connecting from.
    location = /whoami {
        default_type application/json;
        add_header Cache-Control 'no-store' always;
        return 200 '{"ip":"$remote_addr","forwarded":"$http_x_forwarded_for"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
